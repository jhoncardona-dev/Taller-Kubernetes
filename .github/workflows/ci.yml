name: CI/CD del minblog

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probar:
    name: Probar aplicación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ejercicio

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: python -m pytest -v

  desplegar:
    name: Construir y publicar imagen Docker
    needs: probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen
        run: docker build -t ${{ secrets.DOCKER_USER }}/miniblog:latest ./ejercicio

      - name: Publicar imagen
        run: docker push ${{ secrets.DOCKER_USER }}/miniblog:latest
