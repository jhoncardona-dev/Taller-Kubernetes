services:

  web:
    build: .
    ports:
      - "8086:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_PASSWORD: 4628
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: 4628
    volumes:
      - datos_db:/var/lib/postgresql/data

volumes:
  datos_db: